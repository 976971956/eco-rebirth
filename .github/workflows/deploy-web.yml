name: 构建并发布网页版

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出项目
        uses: actions/checkout@v4

      - name: 安装 Godot 4.7.1 与导出模板
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7.1-stable
          export-templates: true

      - name: 解析项目脚本
        run: godot --headless --log-file /tmp/eco-ci-parse.log --path . --editor --quit

      - name: 校验三十种动物与玩法数据
        run: godot --headless --log-file /tmp/eco-ci-species.log --path . --script res://tools/validate_species.gd

      - name: 校验存档、UI 与发布契约
        run: godot --headless --log-file /tmp/eco-ci-release.log --path . --script res://tools/validate_release.gd

      - name: 运行生态烟测
        run: godot --headless --log-file /tmp/eco-ci-runtime.log --path . --quit-after 300 -- --autoplay

      - name: 导出 Web 版本
        run: |
          mkdir -p build/web
          godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.js
          test -s build/web/index.wasm
          test -s build/web/index.pck

      - name: 上传 Pages 文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
